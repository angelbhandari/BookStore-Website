<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – The CozyPage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background-color: #3a1f0d;
      display: flex;
      flex-direction: column;
      font-family: 'Inter', sans-serif;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 40px;
      background: #2c1608;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: #f5e6c8;
      text-decoration: none;
    }

    .logo span { color: #c8781a; }

    .nav-links {
      display: flex;
      gap: 28px;
      align-items: center;
      list-style: none;
    }

    .nav-links a {
      color: #d4b896;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: #f5e6c8; }

    .nav-cart {
      background: #c8781a;
      color: #fff !important;
      padding: 6px 18px;
      border-radius: 6px;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }

    .bg-text {
      position: absolute;
      font-family: 'Playfair Display', serif;
      font-size: 140px;
      color: rgba(200, 120, 26, 0.07);
      font-style: italic;
      user-select: none;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      pointer-events: none;
    }

    .card {
      background: #f7f0e6;
      border-radius: 12px;
      padding: 44px 44px 40px;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    .badge {
      display: inline-block;
      background: #c8781a;
      color: #fff;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 4px;
      margin-bottom: 14px;
      font-weight: 500;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: #2c1608;
      margin-bottom: 4px;
      line-height: 1.25;
    }

    .card-title em { color: #c8781a; }

    .card-sub {
      font-size: 13px;
      color: #7a6050;
      margin-bottom: 28px;
    }

    .field { margin-bottom: 18px; }

    label.field-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #5a3e28;
      margin-bottom: 6px;
      letter-spacing: 0.4px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d4b896;
      border-radius: 7px;
      background: #fff;
      font-size: 14px;
      color: #2c1608;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: 'Inter', sans-serif;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: #c8781a;
      box-shadow: 0 0 0 3px rgba(200, 120, 26, 0.12);
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      margin-top: -4px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: #7a6050;
      cursor: pointer;
    }

    .remember input[type="checkbox"] {
      accent-color: #c8781a;
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    .forgot {
      font-size: 13px;
      color: #c8781a;
      text-decoration: none;
    }

    .forgot:hover { text-decoration: underline; }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #2c1608;
      color: #f5e6c8;
      border: none;
      border-radius: 7px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 16px;
      font-family: 'Inter', sans-serif;
    }

    .btn-primary:hover { background: #3d2010; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: #d4b896;
    }

    .divider span {
      font-size: 12px;
      color: #a08060;
    }

    .btn-outline {
      width: 100%;
      padding: 11px;
      background: transparent;
      color: #5a3e28;
      border: 1px solid #d4b896;
      border-radius: 7px;
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
    }

    .btn-outline:hover {
      border-color: #c8781a;
      background: rgba(200, 120, 26, 0.04);
    }

    .g-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid #d4b896;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #4285F4;
      flex-shrink: 0;
    }

    .signup-text {
      text-align: center;
      font-size: 13px;
      color: #7a6050;
    }

    .signup-text a {
      color: #c8781a;
      text-decoration: none;
      font-weight: 500;
    }

    .signup-text a:hover { text-decoration: underline; }

    footer {
      background: #2c1608;
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: #7a6050;
    }

    footer a { color: #c8781a; text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      nav { padding: 14px 20px; }
      .nav-links { gap: 14px; }
      .card { padding: 32px 24px 28px; }
      .bg-text { font-size: 72px; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="logo">The Cozy<span>Page</span></a>
    <ul class="nav-links">
      <li><a href="categories.html">Categories</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="FAQs.html">FAQs</a></li>
      <li><a href="cart.html" class="nav-cart">Cart</a></li>
    </ul>
  </nav>

  <main>
    <div class="bg-text">Welcome Back</div>

    <div class="card">
      <div class="badge">Member Access</div>
      <h1 class="card-title">Welcome <em>Back,</em><br>Reader</h1>
      <p class="card-sub">Sign in to access your shelf, orders &amp; reading list.</p>

      <form action="#" method="POST">
        <div class="field">
          <label class="field-label" for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>

        <div class="field">
          <label class="field-label" for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>

        <div class="row">
          <label class="remember">
            <input type="checkbox" name="remember" /> Keep me signed in
          </label>
          <a href="#" class="forgot">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary">Sign In</button>
      </form>

      <div class="divider">
        <div class="divider-line"></div>
        <span>or continue with</span>
        <div class="divider-line"></div>
      </div>
      
      <p class="signup-text">New to The CozyPage? <a href="signup.html">Create an account →</a></p>
    </div>
  </main>

  <footer>
    © 2025 The CozyPage &nbsp;·&nbsp; <a href="#">Privacy Policy</a> &nbsp;·&nbsp; <a href="#">Terms of Service</a>
  </footer>
  <script src="login.js"></script>

</body>
</html>
